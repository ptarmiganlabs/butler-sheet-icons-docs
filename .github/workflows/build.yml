# Build validation for the VitePress docs site.
#
# This workflow does NOT deploy. Deployment is handled entirely by Cloudflare
# Pages, which builds and publishes on its own when commits land on a branch.
# See README_DEPLOY.md.
#
# The value here is catching a broken build before Cloudflare tries it: the
# VitePress build fails on dead internal links, so a green check means every
# internal link on the site resolves.
name: Build docs

on:
  pull_request:
    branches: [main, next]
  push:
    branches: [main, next]
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same branch/PR makes an in-flight build irrelevant.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Setup Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        env:
          # Authenticates the GitHub API call in scripts/fetch-bsi-version.mjs
          # so the version lookup is not subject to anonymous rate limits.
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run docs:build
